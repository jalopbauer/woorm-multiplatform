[versions]
# Workspace baselines (match woorm-android-test)
agp = "9.2.0"
kotlin = "2.3.21"
kotlinx-serialization = "1.11.0"
ktor = "3.4.3"
koin = "4.2.1"
coil = "3.4.0"
androidx-activity = "1.13.0"

# Multiplatform stack
# Latest stable Compose Multiplatform; runtime/ui/foundation resolve via the plugin.
compose = "1.12.2"
# JB material3 1.9.0 is the port of androidx M3 1.4.0 — the exact base the
# Android app compiles against via its compose-bom 2026.04.01. Pinned explicitly
# (the plugin accessor would resolve 1.12.0-alpha03, based on androidx M3 1.5 alpha).
material3 = "1.9.0"
material3-adaptive-suite = "1.9.0"
# androidx-lifecycle 2.11.0 per the Compose Multiplatform 1.12.2 compatibility table.
# Navigation must stay on JB 2.9.x: JB 2.10.x ships klibs with ABI 2.4.0
# (built with Kotlin 2.4.20), which Kotlin 2.3.21 cannot consume (KLIB
# resolver: incompatible ABI version). JB 2.9.x tracks the androidx 2.9.x
# the reference Android app uses (androidx.navigation 2.9.8).
androidx-lifecycle = "2.11.0"
androidx-navigation = "2.9.2"
# Multiplatform DataStore (okio-backed, Path-based factory).
# 1.3.0 klibs are ABI 2.4.0 (built with Kotlin 2.4.20) — unconsumable by
# Kotlin 2.3.21 — so pinned to the newest stable release, 1.2.1.
# TODO(phase3): verify coil/datastore vs CMP skiko on iOS at runtime
datastore = "1.2.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose" }
material3-adaptive-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3-adaptive-suite" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-resources = { module = "io.ktor:ktor-client-resources", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
